
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f20">

  <title>MeraHisab — Personal Finance, Simplified</title>
  <meta name="description" content="MeraHisab is a personal expense tracker designed to help you manage income, expenses, savings and accounts with privacy in mind.">
  <meta name="keywords" content="MeraHisab, expense tracker, income tracker, personal finance, offline expense manager">
  <meta name="author" content="MeraHisab">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #080f20;
      --bg2: #0d172b;
      --surface: #111e34;
      --surface2: #172640;
      --surface3: #1c2d49;
      --gold: #d8b878;
      --gold2: #f0d9a6;
      --white: #f8f6f0;
      --muted: #aab5c7;
      --muted2: #7e8ba1;
      --line: rgba(216, 184, 120, 0.18);
      --green: #65c99a;
      --red: #ed8585;
      --radius: 20px;
      --radius-sm: 13px;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      --container: 1160px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      min-width: 320px;
      background:
        radial-gradient(circle at 85% 5%, rgba(36, 64, 105, 0.22), transparent 28rem),
        var(--bg);
      color: var(--white);
      font-family: "DM Sans", sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(var(--container), calc(100% - 48px));
      margin-inline: auto;
    }

    .section {
      padding: 100px 0;
    }

    .section-heading {
      max-width: 680px;
      margin: 0 auto 48px;
      text-align: center;
    }

    .section-kicker {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 14px;
      color: var(--gold);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .section-kicker::before,
    .section-kicker::after {
      width: 22px;
      height: 1px;
      background: var(--gold);
      content: "";
      opacity: 0.7;
    }

    .section-heading h2 {
      margin-bottom: 14px;
      color: var(--white);
      font-family: "Playfair Display", serif;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.2;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 1rem;
    }

    .gold {
      color: var(--gold2);
    }

    .btn {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 22px;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 700;
      transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold2), var(--gold));
      color: #172033;
      box-shadow: 0 9px 28px rgba(216, 184, 120, 0.18);
    }

    .btn-primary:hover {
      background: #f4dfb4;
    }

    .btn-secondary {
      border-color: rgba(216, 184, 120, 0.42);
      background: rgba(255, 255, 255, 0.025);
      color: var(--white);
    }

    .btn-secondary:hover {
      border-color: var(--gold);
      background: rgba(216, 184, 120, 0.08);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      color: var(--gold2);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 14px var(--gold);
    }

    /* HEADER */
   
.header {
  position: sticky;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 9999;
  background: rgba(10, 20, 38, 0.97);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(201, 164, 91, 0.22);
}


    .header-inner {
      display: flex;
      min-height: 82px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      width: 43px;
      height: 43px;
      place-items: center;
      border: 1px solid rgba(240, 217, 166, 0.55);
      border-radius: 14px;
      background: linear-gradient(145deg, #243654, #101c31);
      color: var(--gold2);
      font-family: "Playfair Display", serif;
      font-size: 1.45rem;
      font-weight: 800;
      box-shadow: 0 5px 22px rgba(0, 0, 0, 0.2);
    }

    .brand-name {
      display: block;
      color: var(--white);
      font-family: "Playfair Display", serif;
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .brand-tag {
      display: block;
      margin-top: 4px;
      color: var(--muted2);
      font-size: 0.62rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 23px;
    }

    .nav a:not(.nav-cta) {
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .nav a:not(.nav-cta):hover {
      color: var(--gold2);
    }

    .nav-cta {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 9px 18px;
      border: 1px solid rgba(216, 184, 120, 0.5);
      border-radius: 999px;
      color: var(--gold2);
      font-size: 0.82rem;
      font-weight: 700;
      transition: background 0.2s ease;
    }

    .nav-cta:hover {
      background: rgba(216, 184, 120, 0.1);
    }

     
    /* TIME TOOLS SECTION */
    .time-tools-section {
      position: relative;
      padding: 34px 0 42px;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(216, 184, 120, 0.07), transparent 65%),
        var(--bg2);
    }

    .time-tools-heading {
      margin-bottom: 22px;
      text-align: center;
    }

    .time-tools-heading h2 {
      margin-bottom: 5px;
      color: var(--gold2);
      font-family: "Playfair Display", serif;
      font-size: 1.45rem;
    }

    .time-tools-heading p {
      color: var(--muted2);
      font-size: 0.78rem;
    }

    .time-tools-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: auto;
    }

    .time-card {
      min-width: 0;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(25, 42, 67, 0.96), rgba(14, 26, 45, 0.98));
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.17);
    }

    .time-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .time-card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--white);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .time-card-icon {
      display: grid;
      width: 35px;
      height: 35px;
      flex-shrink: 0;
      place-items: center;
      border: 1px solid rgba(216, 184, 120, 0.28);
      border-radius: 11px;
      background: rgba(216, 184, 120, 0.09);
      color: var(--gold2);
      font-size: 1.05rem;
    }

    .time-zone {
      color: var(--muted2);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .live-time {
      margin: 8px 0 3px;
      color: var(--gold2);
      font-size: clamp(2.1rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.045em;
      line-height: 1.2;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .live-date {
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }

    .clock-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--green);
      font-size: 0.7rem;
      font-weight: 600;
    }

    .clock-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(101, 201, 154, 0.6);
    }

    .stopwatch-display {
      margin: 12px 0 20px;
      color: var(--gold2);
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: 0.045em;
      line-height: 1.2;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .stopwatch-buttons {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .timer-btn {
      min-width: 76px;
      min-height: 37px;
      padding: 8px 14px;
      border: 1px solid rgba(216, 184, 120, 0.35);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--white);
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .timer-btn:hover:not(:disabled) {
      border-color: var(--gold);
      background: rgba(216, 184, 120, 0.12);
    }

    .timer-btn.start {
      border-color: var(--gold);
            background: linear-gradient(135deg, var(--gold2), var(--gold));
      color: #172033;
    }

    .timer-btn:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }

    .lap-heading {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .lap-list {
      display: flex;
      max-height: 112px;
      flex-direction: column;
      gap: 7px;
      overflow-y: auto;
      padding-top: 9px;
    }

    .lap-row {
      display: grid;
      grid-template-columns: 0.7fr 1fr 1fr;
      gap: 8px;
      color: var(--muted);
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
    }

    .lap-row span:nth-child(2),
    .lap-row span:nth-child(3) {
      text-align: right;
    }

    .lap-row span:last-child {
      color: var(--gold2);
    }

    .lap-empty {
      padding: 10px 0 2px;
      color: var(--muted2);
      font-size: 0.72rem;
      text-align: center;
    }

    /* HERO SECTION */
    .hero {
      position: relative;
      padding: 92px 0 100px;
      overflow: hidden;
    }

    .hero::before {
      position: absolute;
      top: 5%;
      right: -180px;
      width: 520px;
      height: 520px;
      border: 1px solid rgba(216, 184, 120, 0.08);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .hero-grid {
      position: relative;
      display: grid;
      grid-template-columns: 1.02fr 0.98fr;
      align-items: center;
      gap: 58px;
    }

    .hero h1 {
      max-width: 650px;
      margin-bottom: 22px;
      color: var(--white);
      font-family: "Playfair Display", serif;
      font-size: clamp(2.7rem, 5.2vw, 4.55rem);
      line-height: 1.12;
      letter-spacing: -0.035em;
    }

    .hero-description {
      max-width: 530px;
      margin-bottom: 30px;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.85;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
      margin-bottom: 24px;
    }

    .hero-note {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted2);
      font-size: 0.76rem;
    }

    .hero-note span {
      color: var(--green);
    }

    /* DASHBOARD PREVIEW */
    .preview-wrap {
      position: relative;
      max-width: 510px;
      margin-inline: auto;
    }

    .preview-glow {
      position: absolute;
      inset: 12% -8%;
      border-radius: 50%;
      background: rgba(216, 184, 120, 0.13);
      filter: blur(70px);
      pointer-events: none;
    }

    .dashboard {
      position: relative;
      padding: 25px;
      border: 1px solid rgba(216, 184, 120, 0.3);
      border-radius: 25px;
      background: linear-gradient(145deg, #182943, #0d192d);
      box-shadow: var(--shadow);
    }

    .dash-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .dash-logo {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--gold2);
      font-family: "Playfair Display", serif;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .dash-logo-mark {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(216, 184, 120, 0.1);
    }

    .dash-label {
      color: var(--muted2);
      font-size: 0.65rem;
    }

    .dash-profile {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 50%;
      background: rgba(216, 184, 120, 0.15);
      color: var(--gold2);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .balance-card {
      padding: 23px;
      border: 1px solid rgba(240, 217, 166, 0.26);
      border-radius: 18px;
      background: linear-gradient(125deg, #263d5c, #172b45);
    }

    .balance-label {
      color: #c1cada;
      font-size: 0.75rem;
    }

    .balance-amount {
      margin: 7px 0 20px;
      color: var(--gold2);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.015em;
    }

    .balance-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .balance-stat {
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .balance-stat small {
      display: block;
      margin-bottom: 3px;
      color: #c1cada;
      font-size: 0.68rem;
    }

    .balance-stat strong {
      font-size: 0.95rem;
    }

    .income-color {
      color: var(--green);
    }

    .expense-color {
      color: var(--red);
    }

    .dash-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 17px 0 23px;
    }

    .dash-action {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 14px 6px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.025);
      text-align: center;
    }

    .dash-action-icon {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 10px;
      background: rgba(216, 184, 120, 0.1);
      color: var(--gold2);
      font-size: 1rem;
    }

    .dash-action-text {
      color: var(--muted);
      font-size: 0.65rem;
      font-weight: 600;
    }

    .dash-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      color: var(--white);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .dash-section-head span:last-child {
      color: var(--gold);
      font-size: 0.68rem;
    }

    .account-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .account-row:last-child {
      border-bottom: 0;
    }

    .account-icon {
      display: grid;
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      place-items: center;
      border-radius: 10px;
      background: rgba(216, 184, 120, 0.09);
      font-size: 0.9rem;
    }

    .account-name {
      flex: 1;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .account-amount {
      color: var(--white);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .preview-caption {
      margin-top: 17px;
      color: var(--muted2);
      font-size: 0.7rem;
      text-align: center;
    }

     
    /* FEATURES SECTION */
    .features-section {
      background: var(--bg);
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .feature-card {
      position: relative;
      min-height: 220px;
      padding: 27px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(23, 38, 64, 0.82), rgba(14, 26, 45, 0.9));
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .feature-card:hover {
      transform: translateY(-5px);
      border-color: rgba(216, 184, 120, 0.55);
    }

    .feature-icon {
      display: grid;
      width: 48px;
      height: 48px;
      margin-bottom: 20px;
      place-items: center;
      border: 1px solid rgba(216, 184, 120, 0.25);
      border-radius: 15px;
      background: rgba(216, 184, 120, 0.09);
      color: var(--gold2);
      font-size: 1.35rem;
    }

    .feature-card h3 {
      margin-bottom: 10px;
      color: var(--white);
      font-size: 1.05rem;
    }

    .feature-card p {
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.8;
    }

    /* PRIVACY SECTION */
    .privacy-section {
      position: relative;
      overflow: hidden;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(ellipse at 10% 50%, rgba(216, 184, 120, 0.08), transparent 50%),
        var(--bg2);
    }

    .privacy-content {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      align-items: center;
      gap: 70px;
    }

    .privacy-visual {
      display: grid;
      min-height: 330px;
      place-items: center;
    }

    .privacy-shield {
      display: grid;
      width: 220px;
      height: 220px;
      place-items: center;
      border: 1px solid rgba(216, 184, 120, 0.35);
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(216, 184, 120, 0.14), rgba(216, 184, 120, 0.025) 68%);
      box-shadow:
        0 0 0 22px rgba(216, 184, 120, 0.025),
        0 0 0 44px rgba(216, 184, 120, 0.018);
      color: var(--gold2);
      font-size: 5rem;
    }

    .privacy-text h2 {
      margin-bottom: 17px;
      color: var(--white);
      font-family: "Playfair Display", serif;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.2;
    }

    .privacy-text > p {
      margin-bottom: 25px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.85;
    }

    .privacy-points {
      display: grid;
      gap: 15px;
    }

    .privacy-point {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .privacy-check {
      display: grid;
      width: 25px;
      height: 25px;
      flex-shrink: 0;
      place-items: center;
      border: 1px solid rgba(101, 201, 154, 0.3);
      border-radius: 50%;
      background: rgba(101, 201, 154, 0.09);
      color: var(--green);
      font-size: 0.75rem;
      font-weight: 800;
    }

    .privacy-point strong {
      display: block;
      margin-bottom: 2px;
      color: var(--white);

      font-size: 0.87rem;
    }

    /* ABOUT SECTION */
    .about-section {
      background: var(--bg);
    }

    .about-content {
      max-width: 850px;
      margin: auto;
      padding: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(23, 38, 64, 0.7), rgba(14, 26, 45, 0.8));
      text-align: center;
    }

    .about-content p {
      margin-bottom: 15px;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.9;
    }

    .about-content p:last-child {
      margin-bottom: 0;
    }

    .about-highlight {
      color: var(--gold2);
      font-weight: 700;
    }

     
    /* FAQ SECTION */
    .faq-section {
      border-top: 1px solid var(--line);
      background: var(--bg2);
    }

    .faq-list {
      display: grid;
      max-width: 820px;
      gap: 13px;
      margin: auto;
    }

    .faq-item {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.025);
    }

    .faq-item summary {
      position: relative;
      padding: 19px 52px 19px 20px;
      color: var(--white);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 700;
      list-style: none;
    }

    .faq-item summary::-webkit-details-marker {
      display: none;
    }

    .faq-item summary::after {
      position: absolute;
      top: 50%;
      right: 20px;
      color: var(--gold);
      content: "+";
      font-size: 1.4rem;
      transform: translateY(-50%);
    }

    .faq-item[open] summary::after {
      content: "−";
    }

    .faq-answer {
      padding: 0 20px 19px;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.8;
    }

    /* DOWNLOAD SECTION */
    .download-section {
      position: relative;
      padding: 90px 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(216, 184, 120, 0.13), transparent 65%),
        var(--bg);
    }

    .download-content {
      max-width: 760px;
      margin: auto;
      padding: 48px 30px;
      border: 1px solid rgba(216, 184, 120, 0.3);
      border-radius: 26px;
      background: linear-gradient(145deg, rgba(25, 42, 67, 0.9), rgba(14, 26, 45, 0.96));
      box-shadow: var(--shadow);
      text-align: center;
    }

    .download-content h2 {
      margin-bottom: 15px;
      color: var(--white);
      font-family: "Playfair Display", serif;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.2;
    }

    .download-content p {
      max-width: 570px;
      margin: 0 auto 25px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.8;
    }

    .download-note {
      margin-top: 15px;
      color: var(--muted2);
      font-size: 0.72rem;
    }

    /* FOOTER */
    .footer {
      padding: 38px 0 24px;
      border-top: 1px solid var(--line);
      background: #070d19;
    }

    .footer-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
      padding-bottom: 25px;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .footer-brand .brand-mark {
      width: 38px;
      height: 38px;
      font-size: 1.2rem;
    }

    .footer-copy {
      color: var(--muted2);
      font-size: 0.76rem;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .footer-links a {
      color: var(--muted);
      font-size: 0.78rem;
      transition: color 0.2s ease;
    }

    .footer-links a:hover {
      color: var(--gold2);
    }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      color: var(--muted2);
      font-size: 0.7rem;
    }

    .footer-bottom a {
      color: var(--gold);
    }

     
    /* TABLET RESPONSIVE */
    @media (max-width: 1000px) {
      .nav {
        gap: 14px;
      }

      .nav a:not(.nav-cta) {
        font-size: 0.78rem;
      }

      .hero-grid {
        gap: 35px;
      }

      .privacy-content {
        gap: 40px;
      }

      .features-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 760px) {
      html {
        scroll-padding-top: 20px;
      }

      .container {
        width: min(100% - 32px, var(--container));
      }

      .section {
        padding: 70px 0;
      }

      .header-inner {
        min-height: auto;
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
        padding-top: 16px;
        padding-bottom: 16px;
      }

      .nav {
        width: 100%;
        justify-content: flex-start;
        gap: 17px;
        overflow-x: auto;
        padding: 3px 0 6px;
        white-space: nowrap;
        scrollbar-width: thin;
      }

      .nav a:not(.nav-cta) {
        font-size: 0.76rem;
      }

      .nav-cta {
        min-height: 36px;
        padding: 7px 13px;
        font-size: 0.74rem;
      }

      .time-tools-section {
        padding: 27px 0 30px;
      }

      .time-tools-grid {
        grid-template-columns: 1fr;
        max-width: 470px;
        gap: 13px;
      }

      .time-card {
        padding: 20px;
      }

      .live-time {
        font-size: 2.6rem;
      }

      .stopwatch-display {
        font-size: 2.35rem;
      }

      .hero {
        padding: 65px 0 75px;
      }

      .hero-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .hero h1 {
        font-size: clamp(2.45rem, 11vw, 3.5rem);
      }

      .hero-description {
        font-size: 0.93rem;
      }

      .preview-wrap {
        width: 100%;
      }

      .dashboard {
        padding: 19px;
      }

      .balance-amount {
        font-size: 1.8rem;
      }

      .privacy-content {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .privacy-visual {
        min-height: 230px;
      }

      .privacy-shield {
        width: 165px;
        height: 165px;
        font-size: 3.8rem;
      }

      .privacy-text {
        text-align: center;
      }

      .privacy-points {
        text-align: left;
      }

      .download-section {
        padding: 65px 0;
      }

      .download-content {
        padding: 35px 22px;
      }

      .footer-content {
        flex-direction: column;
        align-items: flex-start;
      }

      .footer-bottom {
        flex-direction: column;
      }
    }

    /* SMALL MOBILE */
    @media (max-width: 430px) {
      .brand-name {
        font-size: 1.2rem;
      }

      .brand-tag {
        font-size: 0.57rem;
      }

      .time-card {
        padding: 17px 14px;
      }

      .time-card-top {
        gap: 6px;
      }

      .time-zone {
        font-size: 0.61rem;
      }

      .live-time {
        font-size: 2.2rem;
      }

      .stopwatch-display {
        font-size: 2rem;
      }

      .timer-btn {
        min-width: 68px;
        padding: 8px 10px;
      }

      .hero-buttons {
        flex-direction: column;
        align-items: stretch;
      }

      .hero-buttons .btn {
        width: 100%;
      }

      .dashboard {
        padding: 15px;
      }

      .balance-card {
        padding: 18px;
      }

      .balance-amount {
        font-size: 1.55rem;
      }

      .dash-actions {
        gap: 6px;
      }

      .dash-action {
        padding: 11px 4px;
      }

      .dash-action-text {
        font-size: 0.59rem;
      }

      .features-grid {
        grid-template-columns: 1fr;
      }

      .feature-card {
        min-height: auto;
      }

      .about-content {
        padding: 25px 19px;
      }

      .footer-links {
        gap: 14px;
      }
    }

    /* ACCESSIBILITY */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }

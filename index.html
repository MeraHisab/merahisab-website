
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f20">

  <title>MeraHisab — Personal Finance, Simplified</title>
  <meta name="description" content="MeraHisab is a personal expense tracker designed to help you manage income, expenses, savings and accounts with privacy in mind.">
  <meta name="keywords" content="MeraHisab, expense tracker, income tracker, personal finance, offline expense manager">
  <meta name="author" content="MeraHisab">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #080f20;
      --bg2: #0d172b;
      --surface: #111e34;
      --surface2: #172640;
      --surface3: #1c2d49;
      --gold: #d8b878;
      --gold2: #f0d9a6;
      --white: #f8f6f0;
      --muted: #aab5c7;
      --muted2: #7e8ba1;
      --line: rgba(216, 184, 120, 0.18);
      --green: #65c99a;
      --red: #ed8585;
      --radius: 20px;
      --radius-sm: 13px;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      --container: 1160px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      min-width: 320px;
      background:
        radial-gradient(circle at 85% 5%, rgba(36, 64, 105, 0.22), transparent 28rem),
        var(--bg);
      color: var(--white);
      font-family: "DM Sans", sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(var(--container), calc(100% - 48px));
      margin-inline: auto;
    }

    .section {
      padding: 100px 0;
    }

    .section-heading {
      max-width: 680px;
      margin: 0 auto 48px;
      text-align: center;
    }

    .section-kicker {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 14px;
      color: var(--gold);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .section-kicker::before,
    .section-kicker::after {
      width: 22px;
      height: 1px;
      background: var(--gold);
      content: "";
      opacity: 0.7;
    }

    .section-heading h2 {
      margin-bottom: 14px;
      color: var(--white);
      font-family: "Playfair Display", serif;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.2;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 1rem;
    }

    .gold {
      color: var(--gold2);
    }

    .btn {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 22px;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 700;
      transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold2), var(--gold));
      color: #172033;
      box-shadow: 0 9px 28px rgba(216, 184, 120, 0.18);
    }

    .btn-primary:hover {
      background: #f4dfb4;
    }

    .btn-secondary {
      border-color: rgba(216, 184, 120, 0.42);
      background: rgba(255, 255, 255, 0.025);
      color: var(--white);
    }

    .btn-secondary:hover {
      border-color: var(--gold);
      background: rgba(216, 184, 120, 0.08);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      color: var(--gold2);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 14px var(--gold);
    }

    /* HEADER */
   
.header {
  position: sticky;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 9999;
  background: rgba(10, 20, 38, 0.97);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(201, 164, 91, 0.22);
}


    .header-inner {
      display: flex;
      min-height: 82px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      width: 43px;
      height: 43px;
      place-items: center;
      border: 1px solid rgba(240, 217, 166, 0.55);
      border-radius: 14px;
      background: linear-gradient(145deg, #243654, #101c31);
      color: var(--gold2);
      font-family: "Playfair Display", serif;
      font-size: 1.45rem;
      font-weight: 800;
      box-shadow: 0 5px 22px rgba(0, 0, 0, 0.2);
    }

    .brand-name {
      display: block;
      color: var(--white);
      font-family: "Playfair Display", serif;
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .brand-tag {
      display: block;
      margin-top: 4px;
      color: var(--muted2);
      font-size: 0.62rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 23px;
    }

    .nav a:not(.nav-cta) {
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .nav a:not(.nav-cta):hover {
      color: var(--gold2);
    }

    .nav-cta {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 9px 18px;
      border: 1px solid rgba(216, 184, 120, 0.5);
      border-radius: 999px;
      color: var(--gold2);
      font-size: 0.82rem;
      font-weight: 700;
      transition: background 0.2s ease;
    }

    .nav-cta:hover {
      background: rgba(216, 184, 120, 0.1);
    }

     
    /* TIME TOOLS SECTION */
    .time-tools-section {
      position: relative;
      padding: 34px 0 42px;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(216, 184, 120, 0.07), transparent 65%),
        var(--bg2);
    }

    .time-tools-heading {
      margin-bottom: 22px;
      text-align: center;
    }

    .time-tools-heading h2 {
      margin-bottom: 5px;
      color: var(--gold2);
      font-family: "Playfair Display", serif;
      font-size: 1.45rem;
    }

    .time-tools-heading p {
      color: var(--muted2);
      font-size: 0.78rem;
    }

    .time-tools-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: auto;
    }

    .time-card {
      min-width: 0;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(25, 42, 67, 0.96), rgba(14, 26, 45, 0.98));
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.17);
    }

    .time-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .time-card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--white);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .time-card-icon {
      display: grid;
      width: 35px;
      height: 35px;
      flex-shrink: 0;
      place-items: center;
      border: 1px solid rgba(216, 184, 120, 0.28);
      border-radius: 11px;
      background: rgba(216, 184, 120, 0.09);
      color: var(--gold2);
      font-size: 1.05rem;
    }

    .time-zone {
      color: var(--muted2);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .live-time {
      margin: 8px 0 3px;
      color: var(--gold2);
      font-size: clamp(2.1rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.045em;
      line-height: 1.2;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .live-date {
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }

    .clock-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--green);
      font-size: 0.7rem;
      font-weight: 600;
    }

    .clock-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(101, 201, 154, 0.6);
    }

    .stopwatch-display {
      margin: 12px 0 20px;
      color: var(--gold2);
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: 0.045em;
      line-height: 1.2;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .stopwatch-buttons {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .timer-btn {
      min-width: 76px;
      min-height: 37px;
      padding: 8px 14px;
      border: 1px solid rgba(216, 184, 120, 0.35);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--white);
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .timer-btn:hover:not(:disabled) {
      border-color: var(--gold);
      background: rgba(216, 184, 120, 0.12);
    }

      border-color: var(--gold);
